<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="lf-bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1a1005"/>
      <stop offset="55%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#070506"/>
    </radialGradient>
    <radialGradient id="lf-glow" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#ffca7a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lf-star" x1="256" y1="150" x2="256" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff0d4"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f0912a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#lf-bg)"/>
  <circle cx="256" cy="232" r="200" fill="url(#lf-glow)"/>

  <!-- concentric aura rings -->
  <circle cx="256" cy="232" r="150" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.22"/>
  <circle cx="256" cy="232" r="104" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.4"/>

  <!-- luminous four-point star (✦) -->
  <path d="M256 138
           C262 196 270 218 300 232
           C270 246 262 268 256 326
           C250 268 242 246 212 232
           C242 218 250 196 256 138 Z"
        fill="url(#lf-star)"/>

  <!-- wordmark -->
  <text x="256" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400"
        fill="#e7c893" text-anchor="middle" letter-spacing="10">LUMINA</text>
  <text x="256" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="300"
        fill="#8a7654" text-anchor="middle" letter-spacing="16">FUJI</text>
</svg>
